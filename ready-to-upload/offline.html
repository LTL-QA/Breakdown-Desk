<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#142d2c"><title>Breakdown Desk • Offline</title><style>body{font-family:Arial,sans-serif;background:#f5f7f5;color:#203633;max-width:850px;margin:auto;padding:30px 20px}h1{letter-spacing:-1px}aside{background:#fff0d7;color:#866020;padding:17px;border-radius:9px;line-height:1.7}article{background:white;border:1px solid #dce5da;border-radius:10px;padding:20px;margin-top:15px}h2{margin:10px 0}small{color:#81917a}b{color:#3f7153}button{background:#1d513f;color:white;padding:13px 20px;border:0;border-radius:7px;margin:20px 0;cursor:pointer}p{line-height:1.6}</style></head><body><small>PLANT OPERATIONS</small><h1>Breakdown Desk</h1><aside>You are offline. These are the ongoing breakdowns from your last successful sync. Records may have changed. Reconnect to report or close a breakdown.</aside><p id="updated"></p><div id="records"></div><button onclick="location.href='./'">Reconnect</button><script>
try{const d=JSON.parse(localStorage.getItem('breakdown-snapshot')||'null');if(d){document.getElementById('updated').textContent='Last synced: '+new Date(d.at).toLocaleString();const active=d.breakdowns.filter(b=>b.end===null);if(!active.length)document.getElementById('records').textContent='No ongoing breakdowns at the last sync.';active.forEach(b=>{const m=d.machines.find(m=>m.id===b.machineId);const card=document.createElement('article');[['small',m?.department],['h2',m?.name],['b',b.category],['p',b.reason],['small','Started '+new Date(b.start).toLocaleString()]].forEach(([tag,text])=>{const el=document.createElement(tag);el.textContent=text||'';card.appendChild(el)});document.getElementById('records').appendChild(card)})}else document.getElementById('records').textContent='Open the app online first to save a status snapshot.'}catch{document.getElementById('records').textContent='No saved status available.'}
</script></body></html>
